name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FOUNDRY_VERSION: v1.7.1
  NODE_VERSION: "22"
  # The Sequentia node the end-to-end suite runs against: a published Linux
  # release, pinned by version and by the SHA-256 of its tarball.
  SEQ_CORE_VERSION: 24.7.12
  SEQ_CORE_SHA256: 610210a38f02da204301c8158da05bfdd941b65db04640f57e3122fa70a54d86
  # The mint limiter's tool: sequentia-contracts at this commit, built here.
  CONTRACTS_REF: bc0ee3ea6948aae634fc279cab863aa5a9e52f5f
  # The leaf-deposit suite: an Arca operator and wallets (ConcatenaLabs/arca
  # at this commit, built here; one with landing-1 leaves, which a supervised
  # asset needs) on a proof-of-stake chain, which takes a 25.x node release,
  # and the node repository's supply auditor at its tag.
  ARCA_REF: 401e83ae37fd2a7b160dc135c5bfd26d7fe6132b
  SEQ_LEAF_CORE_VERSION: 25.2.2
  SEQ_LEAF_CORE_SHA256: cea11c046c599177952bdcbeacb067301e509e3e127cc516cf944d27eeac2082

jobs:
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: forge build
        working-directory: contracts
        run: forge build
      # The hand-off rehearsal forks Sepolia and skips itself unless
      # REHEARSAL_RPC_URL is set, which it never is here.
      - name: forge test
        working-directory: contracts
        run: forge test

  daemon:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - working-directory: daemon
        run: npm ci
      - working-directory: daemon
        run: npm test

  watcher:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - working-directory: watcher
        run: npm ci
      - working-directory: watcher
        run: npm test

  reserves:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - working-directory: reserves
        run: npm ci
      - working-directory: reserves
        run: npm test

  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Install the daemon's dependencies
        working-directory: daemon
        run: npm ci
      - name: Download the Sequentia node
        run: |
          tarball="sequentia-core-${SEQ_CORE_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "https://sequentiatestnet.com/download/$tarball"
          echo "${SEQ_CORE_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/sequentia-core-${SEQ_CORE_VERSION}/bin"
          "$bin/sequentiad" --version | head -1
          echo "SEQ_BIN_DIR=$bin" >> "$GITHUB_ENV"
      - name: Check out sequentia-contracts for the mint limiter's tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ConcatenaLabs/sequentia-contracts
          ref: ${{ env.CONTRACTS_REF }}
          path: sequentia-contracts
      - name: Build mint-limiter
        run: |
          cargo build --release --locked --manifest-path sequentia-contracts/tools/mint-limiter/Cargo.toml
          echo "MINT_LIMITER=$GITHUB_WORKSPACE/sequentia-contracts/tools/mint-limiter/target/release/mint-limiter" >> "$GITHUB_ENV"
      - name: Run the end-to-end suite
        run: e2e/run-e2e.sh
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: |
            e2e/run/*.log
            e2e/run/seq/elementsregtest/debug.log
          if-no-files-found: ignore

  leaf-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        with:
          version: ${{ env.FOUNDRY_VERSION }}
      - name: Install the daemon's and the snapshot tool's dependencies
        run: |
          (cd daemon && npm ci)
          (cd reserves && npm ci)
      # Bark's gRPC protocol, which the Arca wallet's Bitcoin side speaks, is
      # compiled from its .proto files; PostgreSQL holds the operator's state.
      - name: Install protoc and PostgreSQL
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q protobuf-compiler postgresql
          echo "PG_BIN_DIR=$(ls -d /usr/lib/postgresql/*/bin | tail -1)" >> "$GITHUB_ENV"
      - name: Download the Sequentia node
        run: |
          tarball="sequentia-core-${SEQ_LEAF_CORE_VERSION}-linux-x86_64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$tarball" "https://sequentiatestnet.com/download/$tarball"
          echo "${SEQ_LEAF_CORE_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/sequentia-core-${SEQ_LEAF_CORE_VERSION}/bin"
          "$bin/sequentiad" --version | head -1
          echo "SEQUENTIAD_EXEC=$bin/sequentiad" >> "$GITHUB_ENV"
      - name: Check out the node repository's supply auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ConcatenaLabs/Sequentia
          ref: v${{ env.SEQ_LEAF_CORE_VERSION }}
          path: sequentia-node
          sparse-checkout: contrib/asset-supply-audit
      - name: Check out Arca
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ConcatenaLabs/arca
          ref: ${{ env.ARCA_REF }}
          path: arca
      - name: Check out sequentia-contracts for the mint limiter's tool
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ConcatenaLabs/sequentia-contracts
          ref: ${{ env.CONTRACTS_REF }}
          path: sequentia-contracts
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: arca
      - name: Build arca, arcad, arca-signer and mint-limiter
        run: |
          cargo build --locked --manifest-path arca/Cargo.toml -p arca-server --bin arcad --bin arca-signer
          cargo build --locked --manifest-path arca/Cargo.toml -p arca-cli --bin arca
          echo "ARCA_BIN_DIR=$GITHUB_WORKSPACE/arca/target/debug" >> "$GITHUB_ENV"
          cargo build --release --locked --manifest-path sequentia-contracts/tools/mint-limiter/Cargo.toml
          echo "MINT_LIMITER=$GITHUB_WORKSPACE/sequentia-contracts/tools/mint-limiter/target/release/mint-limiter" >> "$GITHUB_ENV"
      - name: Run the leaf-deposit suite
        env:
          AUDIT_SCRIPT: ${{ github.workspace }}/sequentia-node/contrib/asset-supply-audit/audit.py
        run: e2e/run-leaf-e2e.sh
      - name: Keep the logs of a failed run
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: leaf-e2e-logs
          path: |
            e2e/run-leaf/*.log
            e2e/run-leaf/seq/elementsregtest/debug.log
          if-no-files-found: ignore
